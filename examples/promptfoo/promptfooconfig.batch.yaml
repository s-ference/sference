# Score precomputed sference batch outputs (generated by batch_generate.py) with the
# built-in `echo` provider — no live inference here, just assertions over the outputs.
#
# Run:
#   export SFERENCE_API_KEY=sk_...
#   uv run python examples/promptfoo/batch_generate.py                       # writes batch_tests.json
#   npx promptfoo@latest eval -c examples/promptfoo/promptfooconfig.batch.yaml
#   npx promptfoo@latest view
#
# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Score precomputed sference batch outputs

providers:
  - echo                # echo returns its input (the rendered prompt) verbatim

prompts:
  - '{{output}}'        # the precomputed completion text from batch_generate.py

tests: file://batch_tests.json
