[project]
name = "sference-workspace"
version = "0.1.0"
description = "sference Python SDK and CLI (development workspace)"
requires-python = ">=3.10"
dependencies = [
    "sference-sdk",
    "sference-cli",
]

[tool.uv.workspace]
members = [
    "sdk-python",
    "cli",
    "mcp-server",
]

[tool.uv.sources]
sference-sdk = { workspace = true }
sference-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "jsonschema>=4.23",
]
examples = [
    "prefect>=3.0",
    "pandas>=2.2",
    "dagster>=1.9",
    "ray[data]>=2.40",
    "datasets>=3.0",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "llama-index-core>=0.12",
]
examples-test = [
    { include-group = "examples" },
    "apache-airflow>=3.0",
]
examples-spark = [
    "pyspark>=3.5",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "sdk-python/tests",
    "cli/tests",
    "examples/tests",
]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.uv]
package = false
