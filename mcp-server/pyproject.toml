[project]
name = "sference-mcp"
version = "0.1.0"
description = "Sference MCP server — delegate tasks to Sference Agent Cloud (GPU agent loop with flex tier)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "sference" }]
keywords = ["sference", "mcp", "agent", "inference", "gpu", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "mcp>=1.28",
    "httpx>=0.28",
]

[project.scripts]
sference-mcp = "sference_mcp.server:main"

[project.urls]
Homepage = "https://sference.com"
Repository = "https://github.com/s-ference/sference"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sference_mcp"]
