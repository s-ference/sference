[project]
name = "sference-cli"
version = "0.1.6"
description = "sference command-line interface"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "sference" }]
keywords = ["sference", "llm", "inference", "batch", "cli", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.24.1",
    "sference-sdk>=0.1.6",
]

[project.urls]
Homepage = "https://sference.com"
Repository = "https://github.com/s-ference/sference"
Issues = "https://github.com/s-ference/sference/issues"

[project.scripts]
sference = "sference_cli.main:main"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sference_cli"]

[tool.hatch.build.targets.sdist]
include = ["sference_cli", "README.md"]
