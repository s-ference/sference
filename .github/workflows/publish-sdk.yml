name: Publish SDK to PyPI

# Released independently of the CLI: push an `sdk-v<version>` tag.
# The filename must stay as-is: PyPI trusted publishing is bound to it.
on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: python3 .github/scripts/release_version.py sdk-python "$GITHUB_REF_NAME"

      - name: Build sference-sdk
        run: uv build --package sference-sdk --out-dir dist-sdk

      - name: Publish sference-sdk
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-sdk/

  github-release:
    # After PyPI accepted the upload, so a release never names a version that
    # cannot be installed.
    needs: publish-sdk
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the notes need the previous release tag and history

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release written by hand before the tag was pushed wins.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          fi
          python3 .github/scripts/release_version.py notes sdk-python "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "sference-sdk ${GITHUB_REF_NAME#sdk-v}" --notes-file notes.md --latest=false
