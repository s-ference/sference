name: Publish SDK to PyPI

# Released independently of the CLI: push an `sdk-v<version>` tag.
# The filename must stay as-is: PyPI trusted publishing is bound to it.
on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: python3 .github/scripts/release_version.py sdk-python "$GITHUB_REF_NAME"

      - name: Build sference-sdk
        run: uv build --package sference-sdk --out-dir dist-sdk

      - name: Publish sference-sdk
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-sdk/
