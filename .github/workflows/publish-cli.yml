name: Publish CLI to PyPI

# Released independently of the SDK: push a `cli-v<version>` tag.
# The filename must stay as-is: PyPI trusted publishing is bound to it.
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-cli:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: python3 .github/scripts/release_version.py cli "$GITHUB_REF_NAME"

      - name: Build sference-cli
        run: uv build --package sference-cli --out-dir dist-cli

      # When both packages are released together the SDK tag's run may still be
      # uploading; wait until the CLI's SDK requirement resolves from PyPI so we
      # never publish a CLI that cannot be installed.
      - name: Wait for required SDK on PyPI
        run: |
          uv venv -q /tmp/resolve
          for attempt in $(seq 1 30); do
            if uv pip install -q --refresh --dry-run --python /tmp/resolve dist-cli/*.whl; then
              exit 0
            fi
            echo "SDK requirement not installable yet (attempt $attempt/30); retrying in 20s"
            sleep 20
          done
          echo "::error::sference-cli's sference-sdk requirement never became installable from PyPI"
          exit 1

      - name: Publish sference-cli
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-cli/

  github-release:
    # After PyPI accepted the upload, so a release never names a version that
    # cannot be installed.
    needs: publish-cli
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the notes need the previous release tag and history

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release written by hand before the tag was pushed wins.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          fi
          python3 .github/scripts/release_version.py notes cli "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "sference-cli ${GITHUB_REF_NAME#cli-v}" --notes-file notes.md --latest=true
